{% extends 'pharmacy/base.html' %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6 text-center">
            <div class="card shadow p-4 border-0">
                <h3 class="text-primary fw-bold mb-3">Upload Doctor's Prescription</h3>
                <p class="text-muted">Our AI vision system scans prescriptions and extracts medicine details directly into your cart.</p>
                
                <form method="POST" enctype="multipart/form-data">
                    {% csrf_token %}  <div class="mb-3">
                        <input class="form-control" type="file" name="prescription" required>
                    </div>
                    <button type="submit" class="btn btn-primary btn-lg w-100 fw-bold">Scan with AI</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
