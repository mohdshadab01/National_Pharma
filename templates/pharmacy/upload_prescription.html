{% extends 'pharmacy/base.html' %}

{% block content %}
<div class="container my-5 py-4">
    <div class="row justify-content-center">
        <div class="col-md-8 text-center">
            <div class="card border-0 shadow-lg p-5 rounded-4 bg-white">
                <h2 class="fw-bold text-dark mb-3">Upload Doctor's Prescription</h2>
                <p class="text-muted mb-4">Our AI vision system scans prescriptions and extracts medicine details directly into your cart.</p>
                <form method="POST" enctype="multipart/form-data" action="{% url 'upload_prescription' %}">
                    {% csrf_token %}
                    <div class="mb-4">
                        <input type="file" name="prescription" class="form-control form-control-lg" accept="image/*" required>
                    </div>
                    <button type="submit" class="btn btn-primary btn-lg w-100 rounded-pill fw-bold">Scan with AI</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
