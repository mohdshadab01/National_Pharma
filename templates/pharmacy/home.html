{% extends 'pharmacy/base.html' %}

{% block content %}
<div style="max-width: 800px; margin: 30px auto; padding: 20px; font-family: sans-serif;">
    <h2 style="color: #0d47a1; text-align: center;">Smart AI Prescription Scanner</h2>
    <p style="text-align: center; color: #555;">Doctor ke prescription ki photo upload karein aur AI se medicine details scan karein.</p>

    <!-- Upload Form -->
    <div style="background: #f8f9fa; padding: 25px; border-radius: 8px; border: 1px solid #ddd; margin-top: 20px;">
        <form id="upload-form" enctype="multipart/form-data">
            {% csrf_token %}
            <div style="margin-bottom: 15px;">
                <label style="font-weight: bold; display: block; margin-bottom: 8px;">Prescription Image Choose Karein:</label>
                <input type="file" name="prescription" accept="image/*,.pdf" required style="width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px;">
            </div>
            
            <button type="submit" style="background-color: #0d47a1; color: white; border: none; padding: 12px 20px; font-size: 16px; border-radius: 5px; cursor: pointer; width: 100%;">
                Scan Prescription with AI
            </button>
        </form>
    </div>

    <!-- Results Display Container -->
    <div id="scan-result-display"></div>
</div>
{% endblock %}
