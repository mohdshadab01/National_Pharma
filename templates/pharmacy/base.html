<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>National Pharma - Healthcare & Medical Microbiology</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-light">

    <nav class="navbar navbar-expand-lg bg-white shadow-sm sticky-top py-3">
        <div class="container">
            <a class="navbar-brand fw-bold text-primary fs-4" href="{% url 'home' %}">
                <i class="fa-solid fa-staff-snake text-danger me-2"></i>National Pharma
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto align-items-center gap-3">
                    <li class="nav-item"><a class="nav-link text-dark fw-semibold" href="{% url 'home' %}">Home</a></li>
                    <li class="nav-item"><a class="nav-link text-dark fw-semibold" href="{% url 'medicine_search' %}">Medicines</a></li>
                    <li class="nav-item"><a class="nav-link text-dark fw-semibold" href="{% url 'microbiology' %}">Microbiology</a></li>
                    <li class="nav-item"><a class="nav-link text-dark fw-semibold" href="{% url 'contact' %}">Contact</a></li>
                    <li class="nav-item">
                        <a href="{% url 'upload_prescription' %}" class="btn btn-primary rounded-pill px-3">Upload Prescription</a>
                    </li>
                    <li class="nav-item">
                        <a href="{% url 'cart' %}" class="btn btn-outline-primary rounded-circle"><i class="fa-solid fa-cart-shopping"></i></a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <main>
        {% block content %}{% endblock %}
    </main>

    <footer class="bg-dark text-white pt-5 pb-3 mt-5">
        <div class="container text-center">
            <p>© 2026 National Pharma Research & Healthcare Portal. All rights reserved.</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
