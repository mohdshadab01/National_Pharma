<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>National Pharma - Healthcare Portal</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f8f9fa;
            color: #212121;
        }
        .footer-container {
            background-color: #0a192f;
            color: white;
            text-align: center;
            padding: 30px 20px;
            margin-top: 50px;
            border-top: 4px solid #d32f2f;
        }
        .quotes-slider {
            color: #ffca28;
            font-style: italic;
            margin-bottom: 15px;
            font-size: 1.1rem;
        }
    </style>
</head>
<body>

    {% block content %}
    {% endblock %}

    <footer class="footer-container">
        <div class="quotes-slider" id="quote-display">
            “Wherever the art of Medicine is loved, there is also a love of Humanity.” – Hippocrates
        </div>
        <p style="margin: 5px 0;"><strong>Official Business Email:</strong> support@nationalpharma.com</p>
        <p style="margin: 5px 0;"><strong>Toll-Free Helpline:</strong> +91 1800-123-4567</p>
        <p style="font-size: 0.85rem; color: #aaa; margin-top: 15px;">© 2026 National Pharma Research & Healthcare Portal. All rights reserved.</p>
    </footer>

    <script>
        const quotes = [
            "“Wherever the art of Medicine is loved, there is also a love of Humanity.” – Hippocrates",
            "“Medicines cure diseases, but only doctors can cure patients.” – Carl Jung",
            "“The science of operations is a science of the mind.” – Florence Nightingale"
        ];
        let qIdx = 0;
        setInterval(() => {
            qIdx = (qIdx + 1) % quotes.length;
            const qElem = document.getElementById('quote-display');
            if(qElem) qElem.innerText = quotes[qIdx];
        }, 5000);
    </script>

    <script>
    document.addEventListener("DOMContentLoaded", function () {
        console.log("National Pharma JS Loaded!");

        const uploadForm = document.getElementById('upload-form');
        
        if (uploadForm) {
            uploadForm.addEventListener('submit', async function(e) {
                e.preventDefault(); // Page Reload Hone Se Roko
                
                let formData = new FormData(this);
                let resultDiv = document.getElementById('scan-result-display');
                
                // Loading State
                resultDiv.innerHTML = `
                    <div style="text-align: center; padding: 20px; color: #0d47a1; font-weight: bold; background: #e3f2fd; border-radius: 6px; margin-top: 15px;">
                        <p style="margin: 0;">🔄 Gemini AI Prescription Scan kar raha hai, kripya wait karein...</p>
                    </div>
                `;

                try {
                    let response = await fetch('/scan-prescription/', {
                        method: 'POST',
                        body: formData
                    });
                    
                    let data = await response.json();
                    
                    if (data.status === 'success') {
                        if (data.medicines && data.medicines.length > 0) {
                            let html = `
                            <div style="margin-top: 20px; overflow-x: auto;">
                                <h4 style="color: #0d47a1; margin-bottom: 10px;">✅ AI Detected Prescription Details:</h4>
                                <table border="1" style="width:100%; border-collapse:collapse; text-align:left; font-family: sans-serif; box-shadow: 0 2px 8px rgba(0,0,0,0.1);">
                                    <thead>
                                        <tr style="background-color:#0d47a1; color:white;">
                                            <th style="padding:10px;">Medicine Name</th>
                                            <th style="padding:10px;">Dosage</th>
                                            <th style="padding:10px;">Frequency (1-0-1)</th>
                                            <th style="padding:10px;">Duration</th>
                                            <th style="padding:10px;">Instructions</th>
                                        </tr>
                                    </thead>
                                    <tbody>`;

                            data.medicines.forEach(med => {
                                html += `
                                    <tr style="border-bottom: 1px solid #ddd;">
                                        <td style="padding:10px;"><b>${med.medicine_name || med.name || 'Unclear'}</b></td>
                                        <td style="padding:10px;">${med.dosage || '-'}</td>
                                        <td style="padding:10px; color:#d32f2f; font-weight: bold;">${med.frequency || '-'}</td>
                                        <td style="padding:10px;">${med.duration || '-'}</td>
                                        <td style="padding:10px;">${med.instructions || '-'}</td>
                                    </tr>`;
                            });

                            html += `
                                    </tbody>
                                </table>
                            </div>`;
                            resultDiv.innerHTML = html;
                        } else {
                            resultDiv.innerHTML = `<div style="color: #d32f2f; padding: 15px; background: #ffebee; border-radius: 6px; margin-top: 15px; font-weight: bold;">⚠️ Prescription me koi medicine detect nahi hui. Kripya saaf photo upload karein.</div>`;
                        }
                    } else {
                        resultDiv.innerHTML = `<div style="color: red; padding: 15px; background: #ffebee; border-radius: 6px; margin-top: 15px; font-weight: bold;">❌ Scan Failed: ${data.message}</div>`;
                    }
                } catch (err) {
                    console.error("Prescription Scan Error:", err);
                    resultDiv.innerHTML = `<div style="color: red; padding: 15px; background: #ffebee; border-radius: 6px; margin-top: 15px; font-weight: bold;">❌ Server Error: Request send nahi ho paaye. Check network tab.</div>`;
                }
            });
        } else {
            console.error("ERROR: upload-form ID nahi mili!");
        }
    });
    </script>
</body>
</html>
